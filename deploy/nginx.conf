# nginx reverse proxy in front of fastproxy.
#
# Place this at /etc/nginx/sites-available/fastproxy and symlink it into
# sites-enabled (see deploy notes below). Change the server_name to your
# subdomain.
#
# TLS: with Cloudflare in front, set CF's SSL mode to "Full" and use a
# self-signed cert (the snippet below), or "Full (strict)" with a Cloudflare
# Origin Certificate at /etc/ssl/cf-origin.pem + /etc/ssl/cf-origin.key.
# CF terminates the public TLS; this only secures the CF<->origin hop.

# Redirect plain HTTP to HTTPS.
server {
    listen 80;
    listen [::]:80;
    server_name prox.anikage.cc;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name prox.anikage.cc;

    # Self-signed origin cert (works with Cloudflare "Full"). For "Full (strict)"
    # swap these two lines for the Cloudflare Origin Certificate paths.
    ssl_certificate     /etc/ssl/cf-origin.pem;
    ssl_certificate_key /etc/ssl/cf-origin.key;

    # Streaming proxy: don't buffer the response, hold backpressure to the client.
    location / {
        proxy_pass http://127.0.0.1:3847;

        # Preserve the headers fastproxy relies on.
        proxy_set_header Host              $host;
        proxy_set_header X-Forwarded-For   $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Stream large bodies straight through instead of buffering to disk/RAM.
        proxy_buffering off;
        proxy_request_buffering off;
        proxy_http_version 1.1;

        # Long-lived streams shouldn't be cut off mid-segment.
        proxy_read_timeout  3600s;
        proxy_send_timeout  3600s;
    }
}
