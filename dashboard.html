<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>fastproxy</title>
<style>
  :root{
    --bg:#0b0e14; --panel:#141925; --panel2:#1b2230; --line:#232c3d;
    --txt:#e6ebf5; --mut:#8a97ad; --accent:#5db2ff; --good:#46d39a;
    --warn:#ffb454; --bad:#ff6b6b;
    font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--txt);padding:24px}
  header{display:flex;align-items:center;gap:12px;margin-bottom:20px;flex-wrap:wrap}
  h1{font-size:18px;margin:0;letter-spacing:.5px}
  .dot{width:9px;height:9px;border-radius:50%;background:var(--bad);box-shadow:0 0 8px var(--bad)}
  .dot.live{background:var(--good);box-shadow:0 0 8px var(--good)}
  .meta{color:var(--mut);font-size:12px}
  .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:14px}
  .tile{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:16px 18px}
  .tile .label{color:var(--mut);font-size:11px;text-transform:uppercase;letter-spacing:1px}
  .tile .val{font-size:30px;font-weight:600;margin-top:8px;line-height:1.1}
  .tile .sub{color:var(--mut);font-size:12px;margin-top:4px;min-height:14px}
  .tile.accent .val{color:var(--accent)}
  .tile.good .val{color:var(--good)}
  .tile.warn .val{color:var(--warn)}
  .tile.bad .val{color:var(--bad)}
  .bar{height:6px;background:var(--panel2);border-radius:4px;margin-top:10px;overflow:hidden}
  .bar>i{display:block;height:100%;background:var(--accent);transition:width .4s}
  footer{margin-top:18px;color:var(--mut);font-size:11px}
  a{color:var(--accent)}
</style>
</head>
<body>
<header>
  <span class="dot" id="dot"></span>
  <h1>fastproxy</h1>
  <span class="meta" id="status">connecting…</span>
</header>

<div class="grid" id="grid"></div>
<footer>auto-refresh 2s · <span id="err"></span></footer>

<script>
const $ = id => document.getElementById(id);
const token = location.hash.slice(1) || prompt("dashboard token");
if (location.hash.slice(1) !== token && token) location.hash = token;

let prev = null, prevAt = 0;
const rate = (cur, old, dt) => (old!=null && dt>0) ? (cur-old)/dt : 0;

function human(n, suffix){ // 1234567 -> "1.18 MB" (or MB/s with suffix='B/s')
  const u=['','K','M','G','T','P']; let i=0;
  while(n>=1024 && i<u.length-1){n/=1024;i++;}
  return (n<10&&i>0?n.toFixed(2):n.toFixed(i>0?1:0))+' '+u[i]+suffix;
}
function dur(s){
  const d=Math.floor(s/86400), h=Math.floor(s%86400/3600),
        m=Math.floor(s%3600/60);
  if(d) return `${d}d ${h}h`;
  if(h) return `${h}h ${m}m`;
  return `${m}m ${Math.floor(s%60)}s`;
}

function tile(o){
  const cls = o.cls?` ${o.cls}`:'';
  let extra = '';
  if(o.bar!=null) extra = `<div class="bar"><i style="width:${Math.min(100,o.bar)}%"></i></div>`;
  return `<div class="tile${cls}">
    <div class="label">${o.label}</div>
    <div class="val">${o.val}</div>
    <div class="sub">${o.sub||''}</div>${extra}
  </div>`;
}

function render(s){
  const now = s.now_ms;
  const dt = prev ? (now - prevAt)/1000 : 0;
  const downRate = rate(s.bytes_down, prev?.bytes_down, dt);
  const upRate   = rate(s.bytes_up,   prev?.bytes_up,   dt);
  prev = s; prevAt = now;

  const capPct = s.capacity ? (s.active/s.capacity*100) : null;

  const tiles = [
    tile({label:'Active streams', val:s.active, cls:'accent',
          sub:s.capacity?`of ${s.capacity} max`:'unlimited', bar:capPct}),
    tile({label:'↓ Downstream', val:human(downRate,'B/s'),
          cls:'good', sub:'egress to viewers'}),
    tile({label:'↑ Upstream', val:human(upRate,'B/s'),
          cls:'accent', sub:'ingress from sources'}),
    tile({label:'↓ Total served', val:human(s.bytes_down,'B'), sub:'egress since start'}),
    tile({label:'↑ Total fetched', val:human(s.bytes_up,'B'), sub:'origin pull since start'}),
    tile({label:'Requests', val:s.total_requests.toLocaleString(), sub:'accepted total'}),
    tile({label:'Manifests', val:s.manifests.toLocaleString(), sub:'.m3u8 rewritten'}),
    tile({label:'Redirects', val:s.redirects.toLocaleString(), sub:'3xx re-wrapped'}),
    tile({label:'Upstream errors', val:s.upstream_errors.toLocaleString(),
          cls:s.upstream_errors?'bad':'', sub:'gateway failures'}),
    tile({label:'Rejected', val:s.rejected.toLocaleString(),
          cls:s.rejected?'warn':'', sub:'bad/blocked tokens'}),
    tile({label:'Busy (503)', val:s.busy.toLocaleString(),
          cls:s.busy?'warn':'', sub:'shed at capacity'}),
    tile({label:'Heap', val:human(s.heap_bytes,'B'), sub:'live Go memory'}),
    tile({label:'Goroutines', val:s.goroutines.toLocaleString(), sub:'runtime'}),
    tile({label:'Uptime', val:dur(s.uptime_sec), sub:'since restart'}),
  ];
  $('grid').innerHTML = tiles.join('');
}

async function poll(){
  try{
    const r = await fetch(`/stats?token=${encodeURIComponent(token)}`,{cache:'no-store'});
    if(!r.ok) throw new Error('HTTP '+r.status+(r.status===404?' (bad token?)':''));
    render(await r.json());
    $('dot').classList.add('live');
    $('status').textContent = 'live · '+new Date().toLocaleTimeString();
    $('err').textContent='';
  }catch(e){
    $('dot').classList.remove('live');
    $('status').textContent = 'disconnected';
    $('err').textContent = e.message;
  }
}
poll();
setInterval(poll, 2000);
</script>
</body>
</html>
